name: 立维志愿数据发布

# 触发：手动（workflow_dispatch）+ 定时（高考关键节点，北京时间晚间）
# 说明：数据采集以本地维护者执行为主（GitHub Actions 海外 runner 访问国内政府站受限，
#       远程采集不可靠）；本 workflow 负责校验已提交数据并发布数据包 Release。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 24 6 *'
    - cron: '0 22 5 7 *'
    - cron: '0 22 20 7 *'

permissions:
  contents: write

jobs:
  publish-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装数据层依赖
        run: pip install duckdb python-calamine

      # 校验已提交数据并生成版本（本地采集结果随 data/version.json 提交到仓库）
      - name: 校验并生成版本
        shell: bash
        run: |
          python lever-gaokao/scripts/data_ingest.py validate --json || echo "[skip] 无本地库（未采集）"
          python lever-gaokao/scripts/data_version.py || echo "[skip] 无数据可版本化"

      # 打包数据包：duckdb（若存在）+ version.json + 校验
      - name: 打包数据包
        shell: bash
        run: |
          mkdir -p dist-data
          [ -f data/gaokao.duckdb ] && cp data/gaokao.duckdb dist-data/ || true
          [ -f data/version.json ] && cp data/version.json dist-data/ || true
          cd dist-data
          if [ -f version.json ]; then sha256sum * > SHA256SUMS.txt; fi

      # 发布数据包 Release（tag: data-{version}），供客户端下载更新
      - name: 发布数据包 Release
        if: hashFiles('dist-data/version.json') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('dist-data/version.json'))['data_version'])")
          TAG="data-$VERSION"
          echo "发布数据包 tag=$TAG"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # 只上传文件（gh 不支持上传目录）；duckdb 存在时一并上传
          FILES="dist-data/version.json dist-data/SHA256SUMS.txt"
          [ -f dist-data/gaokao.duckdb ] && FILES="$FILES dist-data/gaokao.duckdb"
          gh release create "$TAG" $FILES \
            --title "立维志愿数据包 v$VERSION" \
            --notes "数据版本清单 + SHA256 校验。客户端通过 gaokao_check_update 检测版本，本地采集官方数据（见 GUIDE.md）或下载本数据包更新。"

      - name: 上传数据包（artifact 存档）
        uses: actions/upload-artifact@v4
        with:
          name: liwei-data-package
          path: dist-data/*
