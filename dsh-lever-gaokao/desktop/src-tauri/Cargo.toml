[package]
name = "liwei-zhiyuan"
version = "0.1.0"
description = "立维志愿 · 高考志愿填报 AI 助手（BYOK 本地客户端）"
edition = "2021"

[lib]
name = "liwei_zhiyuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
